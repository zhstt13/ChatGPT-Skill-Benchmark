name: Benchmark validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate canonical benchmark
        run: python tools/validate_benchmark.py
      - name: Test validation tools
        run: python -m unittest discover -s tests -v

